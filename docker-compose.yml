services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    # -c listen_addresses='' disables TCP listening completely, forcing IPC (Unix Domain Socket) only
    #
    # The remaining flags are explicit tuning. Out of the box postgres:18 runs
    # shared_buffers=128MB / work_mem=4MB / maintenance_work_mem=64MB, which is
    # sized for a generic container and is the main reason repeated scans over
    # the larger tables (personal_logs, faction_attack_logs, merc_contract_hits)
    # fall through to disk. Every value is overridable from .env.
    #
    # SIZING: the defaults below assume a ~4GB instance. Check with `free -h` on
    # the host and adjust:
    #   shared_buffers       ~ 25% of RAM
    #   effective_cache_size ~ 50-75% of RAM (planner hint only, allocates nothing)
    command: >-
      postgres
      -c listen_addresses=''
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      -c random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dejis_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Host socket directory mounted to PostgreSQL standard socket directory for IPC
      - /var/run/postgres-sockets:/var/run/postgresql
      # Persistent database storage (PostgreSQL 18+ stores versioned data under /var/lib/postgresql)
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-dejis_db}", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 3s
      retries: 3
      start_period: 5s

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: ${BESZEL_AGENT_PORT:-45876}
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_HUB_URL:-http://localhost:8090}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      # Required: SSH public key generated when adding the system in Beszel Hub UI
      KEY: ${BESZEL_AGENT_KEY:-}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

